<VirtualHost *:4000>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        # Всё, чего нет на диске, обрабатывает public/index.php
        FallbackResource /index.php
    </Directory>

    # Логи — в stdout/stderr контейнера (docker compose logs api)
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
