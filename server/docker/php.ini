; Дополнения к php.ini-production
expose_php = Off
display_errors = Off
log_errors = On

; Файлы не принимаем, тело запроса небольшое
file_uploads = Off
post_max_size = 128K

; Сессия нужна только админке (CSRF-токен)
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
